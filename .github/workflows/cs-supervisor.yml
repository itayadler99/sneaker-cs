name: sneaker-cs supervisor

# The 24/7 manager. Every few hours: checks both mailboxes, Shopify, the brain,
# the cs-bot workflow health, samples + grades recent auto-replies, and posts a
# Telegram digest. Urgent alert on anything critical. Read-only, cloud-only.
on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch: {}

concurrency:
  group: cs-supervisor
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      STORE_GMAIL_USER: ${{ secrets.STORE_GMAIL_USER }}
      STORE_GMAIL_APP_PASSWORD: ${{ secrets.STORE_GMAIL_APP_PASSWORD }}
      STUDIO_GMAIL_USER: ${{ secrets.STUDIO_GMAIL_USER }}
      STUDIO_GMAIL_APP_PASSWORD: ${{ secrets.STUDIO_GMAIL_APP_PASSWORD }}
      STATION_SHOP_DOMAIN: ${{ secrets.STATION_SHOP_DOMAIN }}
      STATION_ADMIN_TOKEN: ${{ secrets.STATION_ADMIN_TOKEN }}
      STUDIO_SHOP_DOMAIN: ${{ secrets.STUDIO_SHOP_DOMAIN }}
      STUDIO_ADMIN_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run supervisor
        run: python route-b/supervisor.py
