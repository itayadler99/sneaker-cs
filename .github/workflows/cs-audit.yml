name: sneaker-cs skip audit

# The second opinion on our own skip rules. Every other check asks whether the
# machine is running; this one asks whether a person we threw away was waiting
# for an answer. It releases anything it finds back to the bot, so it repairs
# the mailbox instead of only reporting on it.
on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      AI_GATEWAY_MODEL: ${{ secrets.AI_GATEWAY_MODEL }}
      STORE_GMAIL_USER: ${{ secrets.STORE_GMAIL_USER }}
      STORE_GMAIL_APP_PASSWORD: ${{ secrets.STORE_GMAIL_APP_PASSWORD }}
      STUDIO_GMAIL_USER: ${{ secrets.STUDIO_GMAIL_USER }}
      STUDIO_GMAIL_APP_PASSWORD: ${{ secrets.STUDIO_GMAIL_APP_PASSWORD }}
      STATION_SHOP_DOMAIN: ${{ secrets.STATION_SHOP_DOMAIN }}
      STATION_ADMIN_TOKEN: ${{ secrets.STATION_ADMIN_TOKEN }}
      STUDIO_SHOP_DOMAIN: ${{ secrets.STUDIO_SHOP_DOMAIN }}
      STUDIO_ADMIN_TOKEN: ${{ secrets.STUDIO_ADMIN_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python route-b/audit_skipped.py
